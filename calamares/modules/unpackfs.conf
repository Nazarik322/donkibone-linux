---
unpack:
    # The live image is the system to install.
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        # The offline driver repo is only read during installation.
        exclude: [ "/opt/celestia-offline/" ]
    # mkarchiso keeps the kernel outside the image.
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-cachyos"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux-cachyos"
