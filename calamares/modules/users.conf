---
defaultGroups:
    - wheel
    - rfkill
    - sys
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - input

# Autologin is configured through greetd by celestia-configure: the session
# then locks itself, so the password is still required.
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
  shell: /usr/bin/fish
  forbidden_names: [ root, adm, bin, daemon, dbus, ftp, games, greeter, halt, http, lp, mail, man, news,
                     nobody, ntp, operator, polkitd, rtkit, shutdown, sync, sys, systemd-coredump,
                     systemd-network, systemd-resolve, systemd-timesync, uucp, uuidd, liveuser ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "celestia-${cpu}"
  forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
