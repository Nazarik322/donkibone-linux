---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

# Offline installer: no internet check, no GeoIP.
requirements:
    requiredStorage:    30   # same as MIN_TARGET in celestia-disks
    requiredRam:        2.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root
