# Calamares configuration of the Celestia installer: offline installation that
# copies the live image to disk, then adapts it to the hardware.
---
# "local" is only /usr/lib/calamares/modules; our celestiadisk module lives in
# /etc/calamares/modules (copied there by celestia-installer).
modules-search: [ local, /etc/calamares/modules ]

instances:
- id:       celestia-prepare
  module:   shellprocess
  config:   shellprocess-celestia-prepare.conf
- id:       celestia-configure
  module:   shellprocess
  config:   shellprocess-celestia-configure.conf
- id:       celestia-bootloader
  module:   shellprocess
  config:   shellprocess-celestia-bootloader.conf
- id:       celestia-finish
  module:   shellprocess
  config:   shellprocess-celestia-finish.conf

sequence:
# The disk is chosen before Calamares starts (celestia-diskpick) and written by
# celestiadisk, which refuses anything that could touch Windows or user data.
- show:
  - welcome
  - locale
  - keyboard
  - users
  - summary
- exec:
  - celestiadisk
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - networkcfg
  - shellprocess@celestia-prepare
  - shellprocess@celestia-configure
  - services-systemd
  - initcpiocfg
  - initcpio
  - shellprocess@celestia-bootloader
  - shellprocess@celestia-finish
  - umount
- show:
  - finished

branding: celestia
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
