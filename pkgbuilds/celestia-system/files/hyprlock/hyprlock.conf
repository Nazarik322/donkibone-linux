# Celestia: first lock screen right after autologin (until the caelestia shell
# takes over) and fallback when the shell is not available. Palette: theme/palette.env

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/celestia/wallpapers/celestia.webp
    blur_passes = 3
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgb(e5e1e7)
    font_size = 72
    font_family = Rubik
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 26
    outline_thickness = 2
    outer_color = rgb(c2c1ff)
    inner_color = rgb(201f23)
    font_color = rgb(e5e1e7)
    check_color = rgb(c2c1ff)
    fail_color = rgb(ffb4ab)
    placeholder_text = Пароль
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
