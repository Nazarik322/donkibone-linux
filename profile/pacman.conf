# pacman.conf used to BUILD the image (scripts render @...@ placeholders).
# The installed system gets airootfs/etc/pacman.conf instead, without the local repo.

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3  # @MARCH_ARCH
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 8
DisableDownloadTimeout
# Like CachyOS's ISO build: the download sandbox can fail in containers/WSL.
DisableSandbox
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Packages we build ourselves (pinned caelestia stack + AUR). First, so they win.
[@LOCAL_REPO_NAME@]
SigLevel = Optional TrustAll
Server = file://@LOCAL_REPO_DIR@

# CachyOS x86-64-v3 optimized repos, same order as a CachyOS install
# @MARCH_V3_BEGIN
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
# @MARCH_V3_END

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
