# Used when the ISO is booted from a file (e.g. Ventoy, GRUB loopback).
# https://www.supergrubdisk.org/wiki/Loopback.cfg

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

set default=celestia
set timeout=5
set timeout_style=menu

menuentry "Установить Celestia" --id celestia {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=4G copytoram=n quiet loglevel=3 module_blacklist=pcspkr nvme_load=yes
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "Установить Celestia (безопасная графика)" --id celestia-safe {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=4G copytoram=n module_blacklist=pcspkr,nouveau,nvidia,nvidia_drm,nvidia_modeset,amdgpu,radeon,i915,xe nvme_load=yes celestia.safegraphics=1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}
