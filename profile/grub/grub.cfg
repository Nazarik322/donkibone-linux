# Boot menu of the Celestia USB stick. %...% placeholders are filled in by mkarchiso.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png

set celestia_theme=/boot/grub/themes/celestia
if loadfont ${celestia_theme}/celestia-20.pf2 ; then
    loadfont ${celestia_theme}/celestia-32.pf2
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
    set theme=${celestia_theme}/theme.txt
fi

set default=celestia
set timeout=5
set timeout_style=menu

menuentry "Установить Celestia" --id celestia {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n quiet loglevel=3 module_blacklist=pcspkr nvme_load=yes
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "Установить Celestia (безопасная графика)" --id celestia-safe {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=pcspkr,nouveau,nvidia,nvidia_drm,nvidia_modeset,amdgpu,radeon,i915,xe nvme_load=yes celestia.safegraphics=1
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
}

menuentry "Настройки UEFI" --id uefi-firmware {
    fwsetup
}

menuentry "Перезагрузка" --id reboot {
    reboot
}

menuentry "Выключение" --id poweroff {
    halt
}
