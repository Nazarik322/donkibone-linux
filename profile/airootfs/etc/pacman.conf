# pacman configuration of the installed system: CachyOS x86-64-v3 repos, same
# order as a regular CachyOS installation. See pacman.conf(5).

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3  # @MARCH_ARCH
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 8
DisableDownloadTimeout
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Celestia packages of the chosen update channel (stable/beta/dev), first so that they
# win over same-named packages elsewhere. Change with: sudo celestia-channel
Include = /etc/pacman.d/celestia.conf

# @MARCH_V3_BEGIN
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
# @MARCH_V3_END

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
